version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fisiocom_postgres
    environment:
      POSTGRES_USER: fisiouser1
      POSTGRES_PASSWORD: iZn0vb8KkG6KUGYloUoWfuo02bjevHO0
      POSTGRES_DB: fisiocom
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisiocom"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
